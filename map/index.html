<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>施設マップ - サバイバルが如く</title>

    <link
        rel="stylesheet"
        href="/style.css">

    <link
        rel="stylesheet"
        href="/map/map.css">

</head>


<body>


    <!-- =========================
         ナビゲーション
    ========================== -->

    <header class="navbar">

        <a
            href="/"
            class="logo">
            サバイバルが如く
        </a>


        <nav>

            <a href="/">
                ホーム
            </a>
        
            <a href="/join/">
                参加方法
            </a>
        
            <a href="/rule/">
                ルール
            </a>
        
            <span class="nav-divider"></span>
        
            <a href="/map/" class="active">
                施設座標
            </a>

        </nav>

    </header>



    <!-- =========================
         マップ
    ========================== -->

    <main class="map-page">

        <!-- ホームボタン（スマホのみ表示） -->
        <a href="../" class="map-home-button" aria-label="ホームへ戻る">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M5.5 9.5V21h13V9.5"></path>
                <path d="M9 21v-7h6v7"></path>
            </svg>
        </a>

        <div class="map-header">
            <p>
                地図をドラッグして移動できます。
                ホイールで拡大・縮小できます。
            </p>
        </div>


        <div id="map-container">

            <div id="map">

            </div>

            <div class="map-zoom-control">

                <button id="zoom-out">
                    −
                </button>
            
                <span id="zoom-level">
                    100%
                </span>
            
                <button id="zoom-in">
                    ＋
                </button>
            
            </div>
        </div>

        <!-- =========================
             施設一覧
        ========================== -->

        <div id="facility-menu" class="facility-menu">

            <button id="facility-menu-toggle" class="facility-menu-toggle">
                施設メニューを閉じる
            </button>
        
            <div id="facility-filter" class="facility-filter"></div>
        
            <div id="facility-list" class="facility-list"></div>
        
        </div>

        <!-- 施設情報 -->

        <div
            id="facility-info"
            class="facility-info hidden">

            <button
                id="facility-close">

                ×

            </button>
        
            <h2 id="facility-name">
            </h2>

            <p
                id="facility-coordinates"
                class="facility-coordinates">
            </p>

            <p
                id="facility-description">
            </p>
        
        </div>

    </main>



    <!-- =========================
         フッター
    ========================== -->

    <!-- <footer>

        <div class="footer-logo">
            サバイバルが如く
        </div>

        <p>
            *このサイトは一部AIを使用して制作されています。
        </p>

        <p class="copyright">
            © 2026 サバイバルが如く
        </p>

    </footer> -->


    <script src="map.js"></script>

</body>

</html>
